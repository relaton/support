name: Deploy

# Build the relaton-data-<flavor> index site and publish it to GitHub Pages.
#
# This replaces the previous Jekyll build (checkout the
# relaton/jekyll-theme-relaton-data-index theme, merge _config.yml, `jekyll
# build`) with a single `relaton index` invocation: relaton-cli reads the repo's
# ./data folder and emits a self-contained, crawler-indexable index that inlines
# a compiled Vue+Tailwind bundle. See relaton/relaton#83.
#
# Callers need no changes — it stays `workflow_call` with no required inputs:
#
#   jobs:
#     deploy:
#       uses: relaton/support/.github/workflows/data-deploy.yml@main
#
# Optional inputs let a repo override the title / data dir / delivery mode.

on:
  workflow_call:
    inputs:
      title:
        description: "Index page title (default: '<FLAVOR> Index' from the repo name)"
        required: false
        type: string
      data-dir:
        description: "Folder of Relaton YAML documents"
        required: false
        default: "data"
        type: string
      mode:
        description: "Data delivery mode: embedded | dom | static-json"
        required: false
        default: "embedded"
        type: string
      relaton-cli-version:
        description: "relaton-cli version to install (default: latest released)"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  build_index_page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # The released relaton-cli gem ships the compiled frontend bundle, so the
      # job needs only Ruby (no Node build here).
      - name: Install relaton-cli
        run: |
          if [ -n "${{ inputs.relaton-cli-version }}" ]; then
            gem install relaton-cli -v "${{ inputs.relaton-cli-version }}"
          else
            gem install relaton-cli
          fi

      - name: Derive title
        id: meta
        run: |
          title="${{ inputs.title }}"
          if [ -z "$title" ]; then
            flavor="${GITHUB_REPOSITORY##*/}"      # relaton-data-bipm
            flavor="${flavor#relaton-data-}"        # bipm
            title="$(echo "$flavor" | tr '[:lower:]' '[:upper:]') Index"
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"

      - name: Build index site
        run: |
          relaton index "${{ inputs.data-dir }}" \
            --output _site \
            --mode "${{ inputs.mode }}" \
            --title "${{ steps.meta.outputs.title }}" \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3

  deploy:
    # Deploy from the repository's default branch. Hardcoding master/main
    # excluded relaton-data-* repos that have moved their default branch
    # (e.g. v2), causing fresh data to be built but never published.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build_index_page

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
