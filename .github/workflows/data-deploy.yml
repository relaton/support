name: Deploy

# Build the relaton-data-<flavor> index site and publish it to GitHub Pages.
#
# Replaces the previous Jekyll build (checkout jekyll-theme-relaton-data-index,
# merge _config.yml, `jekyll build`) with a single `relaton index` run:
# relaton-cli reads the repo's ./data folder and emits a page that inlines a
# compiled Vue+Tailwind bundle and fetches its documents as JSON shards. See
# relaton/relaton#83 — and note the shift described below: the output was
# originally self-contained and crawler-indexable, and is now neither.
#
# Callers need no changes — it stays `workflow_call` with no required inputs:
#
#   jobs:
#     deploy:
#       uses: relaton/support/.github/workflows/data-deploy.yml@main
#
# Callers should publish on the crawler finishing rather than on a cron guessed
# to land after it — see `cimas-config/gh-actions/data/deploy.yml`, the template
# Cimas syncs into every relaton-data-* repo. A caller needs only the trigger;
# both the "skip a failed crawler run" guard and the Pages concurrency group are
# declared here, so no per-repo copy can drift or forget them.
#
# Per-flavor branding — `title`, `favicon` and `description` (relaton/relaton#96)
# — is resolved HERE, from relaton/support's `data-index/configs.yml`, and not
# passed by the caller. cimas.yml maps `.github/workflows/deploy.yml` as a
# whole-file copy for 29 repos, so a `with:` block carrying branding is wiped on
# the next `cimas sync` and the page silently loses its favicon and description —
# nothing goes red. Keeping the caller byte-identical fleet-wide is what makes a
# sync safe; see `data-index/README.adoc`.
#
# The three inputs remain declared and still win when a caller sets one
# explicitly (a reusable workflow rejects an undeclared input at parse time, so
# they could not be removed without breaking existing callers anyway). Blank —
# what an omitted input arrives as — falls through to configs.yml.
#
# The trade this makes: relaton/support becomes a runtime dependency of every
# Pages build, not just the source of this file. A bad configs.yml breaks all 29
# at once, which is why the resolve step runs before the expensive build and
# `job.workflow_sha` pins the data to the same commit as this workflow.
#
# There is no `mode` input. `relaton index` used to take
# `--mode embedded|dom|static-json`, trading a crawler-indexable DOM against page
# weight — a choice that mattered because the whole corpus went into ONE page
# (relaton-data-3gpp's is 151,688,883 bytes; relaton-data-ids' would be ~290 MB —
# only ~6.4 MB on the wire once Pages gzips it, but the browser still parses the
# full text and builds a DOM node per document, which is what made them
# unopenable). relaton-cli now always emits sharded JSON — `search-NNNN.json`
# summaries loaded progressively, `detail-NNNN.json` fetched when a panel opens,
# behind a ~110 KB index.html — so nothing is left to choose and the flag is
# gone rather than deprecated.
#
# This workflow had to stop passing `--mode` BEFORE that lands. Every caller
# builds relaton-cli from relaton/relaton@main — 12 of the 14 live callers pin
# `source: git` themselves and the rest inherit it from the default below — so
# upstream changes arrive on the next run with no release anywhere to gate them.
# That cuts both ways: an upstream break reaches every caller at once, and the
# sharding change will too, with no per-repo edit.
#
# (14 of the 32 relaton-data-* repos have a caller at all; the rest are the
# unfinished Cimas rollout, tracked in data-index/README.adoc.)
#
# The input cannot come back on its own either: a caller `with:` naming an input
# the called workflow does not declare fails the run immediately with "Invalid
# input, 'mode' is not defined in the referenced workflow", so callers and this
# file move together. Verified at the time of writing: no relaton-data-* caller
# passes one.
#
# Two source modes (input `source`):
#   * git (default) — build relaton + relaton-cli straight from GitHub (with
#     pubid from git main, which relaton tracks). Compiles the frontend on the
#     fly, so this mode also needs Node. Measured on relaton-data-3gpp (88,464
#     documents): 61 s to compile the frontend and resolve the bundle, 80 s for
#     `relaton index`, ~3 min 10 s for the whole run; small flavors finish in
#     under two minutes.
#   * gem           — install the released relaton-cli gem. Ruby only; the gem
#     ships the precompiled frontend bundle. Unusable until a release carries
#     the `index` command — see the note on the input below.

on:
  workflow_call:
    inputs:
      # Defaults to `git` because no released relaton-cli has the `index`
      # command — the latest stable is 2.1.2 (2026-05-29) and even
      # 3.0.0.pre.alpha.1 predates it — so a `gem` build cannot work: `relaton
      # index` exits 0 printing `Could not find command "index"`, nothing writes
      # _site, and the run dies at actions/upload-pages-artifact. It also lets
      # `relaton index` be iterated on without cutting a release per change.
      #
      # FLIP BACK TO "gem" once relaton v3 is stable and released. Here that is
      # this one line — the gem path is kept, not pruned, and pinned by
      # spec/data_deploy_workflow_spec.rb — but the twelve callers that still pin
      # `source: git` themselves keep building from git until a `cimas sync`
      # drops their pins. A release also ends the git path's cost: Node,
      # `npm ci` and a frontend compile on every build.
      #
      # `relaton-ref` deliberately stays `main` rather than a known-good SHA
      # (contra the trigger/concurrency hand-off's §3): a bump-per-change here is
      # the same treadmill as a release. A broken upstream is not a broken site —
      # `deploy` only runs when the build succeeds, so each repo keeps serving its
      # last successful deployment. The input stays available for a repo that
      # needs to freeze.
      source:
        description: "Where to get relaton-cli: 'gem' (released) or 'git' (build from GitHub)"
        required: false
        default: "git"
        type: string
      # The branding trio. Normally unset: `Resolve branding` below reads these
      # per flavor from relaton/support's data-index/configs.yml. Setting one
      # here overrides that repo's row for this caller only.
      title:
        description: "Override the index page title (default: from data-index/configs.yml)"
        required: false
        default: ""
        type: string
      favicon:
        description: "Override the favicon URL or output-relative path (default: from data-index/configs.yml)"
        required: false
        default: ""
        type: string
      description:
        description: "Override the description (<meta name=\"description\"> and header subtitle)"
        required: false
        default: ""
        type: string
      support-ref:
        description: "relaton/support ref to read branding from (default: this workflow's own commit)"
        required: false
        default: ""
        type: string
      data-dir:
        description: "Folder of Relaton YAML documents"
        required: false
        default: "data"
        type: string
      # Only consulted on the `gem` path, which is no longer the default: setting
      # this alone now does nothing. Pass `source: gem` with it.
      relaton-cli-version:
        description: "gem source (needs source: gem): relaton-cli version to install (default: latest)"
        required: false
        default: ""
        type: string
      relaton-repo:
        description: "git source: repo to build relaton/relaton-cli from"
        required: false
        default: "relaton/relaton"
        type: string
      relaton-ref:
        description: "git source: ref (branch/tag/sha) to build"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

# Serialize Pages deployments per calling repo. Runs overlap easily — the caller
# template fires on `workflow_run` *and* a fallback cron, and a build runs for
# minutes — and two concurrent actions/deploy-pages runs make the loser fail with
# a concurrent-deployment error. Mirrors GitHub's own Pages starter workflow.
#
# Declared at the top level of this *called* workflow, which is where GitHub
# documents concurrency for a reusable workflow to live: `jobs.<id>.concurrency`
# on the calling job does not behave as expected. One group per caller repo
# (`github.repository` evaluates in the caller's context), so no data repo ever
# queues behind a sibling. `cancel-in-progress: false` is deliberate — queue
# deployments rather than kill a Pages deploy mid-flight.
#
# Only runs that can actually publish share the queue. Under GitHub's default
# `queue: single` a *pending* run is cancelled the moment a third joins its
# group, so anything parked in the deployment queue that will never deploy can
# drop a queued run carrying freshly crawled data — the staleness this
# workflow's triggers exist to avoid. Any run that builds and then skips
# `deploy` — a `workflow_dispatch` from a non-default branch, or a
# pull request or tag push from a caller that still triggers on them, which the
# Cimas template no longer does — is keyed by ref into a group of its own.
#
# The discriminator is the deploy job's own gate, so the two cannot drift.
concurrency:
  group: >-
    pages-${{ github.repository }}-${{
    github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    && 'deploy' || github.ref }}
  cancel-in-progress: false

jobs:
  build_index_page:
    # A `workflow_run` caller fires on `completed`, not `success` (there is no
    # `success` activity type), so filter the conclusion here: rebuild for every
    # other trigger, but skip a run whose crawler actually failed. This lives in
    # the shared workflow rather than in each caller's `deploy:` job so no caller
    # can forget it — a called workflow inherits the caller run's `github`
    # context, event payload included. `deploy` is `needs: build_index_page`, so
    # skipping the build skips the publish with it.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      # Both source paths are `if:`-gated, so an unrecognised value skips all of
      # them: nothing installs relaton-cli, nothing writes _site, and the run
      # dies at actions/upload-pages-artifact blaming the upload for a bad input.
      # First step in the job — it costs nothing and needs no checkout.
      - name: Validate source input
        if: inputs.source != 'gem' && inputs.source != 'git'
        # By env, not `${{ }}`: the value is caller-supplied and would otherwise
        # be substituted as raw shell text — same rule as the build steps below.
        env:
          SOURCE: ${{ inputs.source }}
        run: |
          echo "::error::Unknown source '$SOURCE' (expected 'gem' or 'git')"
          exit 1

      - uses: actions/checkout@v4 # the data repo (has ./data)

      # Must come AFTER the checkout above: a checkout into the workspace root
      # clears the directory first, which would delete this one.
      #
      # `job.workflow_repository` and `job.workflow_sha` are the repo and commit
      # THIS reusable workflow was loaded from — GitHub documents exactly this
      # pair for a reusable workflow checking out its own source. So the resolver
      # code and configs.yml always come from one commit, and
      # `uses: .../data-deploy.yml@some-branch` reads that branch's branding with
      # no caller-side input to set and remember to remove.
      #
      # Not the `github` context: a called workflow inherits the CALLER's, so
      # `github.workflow_ref`/`workflow_sha` name the data repo's own deploy.yml,
      # and `github.job_workflow_sha` is not a property at all — it is an OIDC
      # token claim. An unknown property evaluates to null rather than failing,
      # which would have silently resolved `ref:` to support's default branch.
      - name: Checkout relaton/support (branding source of truth)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ inputs.support-ref || job.workflow_sha }}
          path: .relaton-support
          # Nothing pushes from here; no reason to leave a credential in the
          # workspace's .git/config.
          persist-credentials: false
          # Cone mode (the default) is correct — these are directories, not
          # globs. Do not add sparse-checkout-cone-mode.
          sparse-checkout: |
            bin
            lib
            data-index

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      # Ahead of the source-specific steps on purpose: the git-source build
      # exports BUNDLE_GEMFILE to $GITHUB_ENV for every later step, and a
      # branding failure should surface before the frontend compile and the
      # corpus parse, not after them.
      - name: Resolve branding
        id: branding
        # The inputs travel by env for the same reason the build steps below do,
        # and so nothing caller-supplied is interpolated into this shell.
        env:
          TITLE: ${{ inputs.title }}
          FAVICON: ${{ inputs.favicon }}
          DESCRIPTION: ${{ inputs.description }}
        run: |
          ruby .relaton-support/bin/index-branding "$GITHUB_REPOSITORY" \
            --title "$TITLE" \
            --favicon "$FAVICON" \
            --description "$DESCRIPTION" \
            >> "$GITHUB_OUTPUT"

      # ---- gem source: install the released gem, Ruby only --------------------
      - name: Install relaton-cli (released gem)
        if: inputs.source == 'gem'
        run: |
          if [ -n "${{ inputs.relaton-cli-version }}" ]; then
            gem install relaton-cli -v "${{ inputs.relaton-cli-version }}"
          else
            gem install relaton-cli
          fi

      # ---- git source: build relaton + relaton-cli from GitHub -----------------
      # relaton-cli's frontend/dist is gitignored, so it must be compiled here
      # (needs Node). pubid is taken from git main, which relaton's code tracks.
      - name: Checkout relaton (git source)
        if: inputs.source == 'git'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.relaton-repo }}
          ref: ${{ inputs.relaton-ref }}
          path: .relaton-src

      - name: Setup Node (git source)
        if: inputs.source == 'git'
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend + bundle from GitHub (git source)
        if: inputs.source == 'git'
        run: |
          set -euo pipefail
          # Compile the Vue+Tailwind bundle into frontend/dist (gitignored).
          ( cd .relaton-src/gems/relaton-cli/frontend && npm ci && npm run build )
          # Resolve relaton + relaton-cli from the checkout and pubid from git
          # main (same as the relaton repo's own root Gemfile).
          cat > "$RUNNER_TEMP/Gemfile.index" <<RUBY
          source "https://rubygems.org"
          gem "relaton", path: "${{ github.workspace }}/.relaton-src"
          gem "relaton-cli", path: "${{ github.workspace }}/.relaton-src/gems/relaton-cli"
          gem "pubid", git: "https://github.com/metanorma/pubid.git", branch: "main"
          RUBY
          echo "BUNDLE_GEMFILE=$RUNNER_TEMP/Gemfile.index" >> "$GITHUB_ENV"
          BUNDLE_GEMFILE="$RUNNER_TEMP/Gemfile.index" bundle install

      - name: Build index (gem source)
        if: inputs.source == 'gem'
        # All three branding values are free-form prose, and `${{ }}` is
        # substituted as raw text before bash parses the line — an inlined
        # description reading `IEC "TC 1" registry` would word-split into stray
        # argv entries, and one containing $(...) would execute. Passing them by
        # env hands the runner's verbatim value to the shell. `title` belongs
        # here too now that it originates in relaton/support rather than in the
        # calling repo's own file.
        env:
          TITLE: ${{ steps.branding.outputs.title }}
          FAVICON: ${{ steps.branding.outputs.favicon }}
          DESCRIPTION: ${{ steps.branding.outputs.description }}
        run: |
          relaton index "${{ inputs.data-dir }}" \
            --output _site \
            --title "$TITLE" \
            --favicon "$FAVICON" \
            --description "$DESCRIPTION" \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - name: Build index (git source)
        if: inputs.source == 'git'
        # BUNDLE_GEMFILE is exported to GITHUB_ENV in the build step above.
        # TITLE/FAVICON/DESCRIPTION travel by env for the same reason as the gem
        # step.
        env:
          TITLE: ${{ steps.branding.outputs.title }}
          FAVICON: ${{ steps.branding.outputs.favicon }}
          DESCRIPTION: ${{ steps.branding.outputs.description }}
        run: |
          bundle exec relaton index "${{ github.workspace }}/${{ inputs.data-dir }}" \
            --output "${{ github.workspace }}/_site" \
            --title "$TITLE" \
            --favicon "$FAVICON" \
            --description "$DESCRIPTION" \
            --base-url "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${GITHUB_REF_NAME}"

      - uses: actions/configure-pages@v4

      - uses: actions/upload-pages-artifact@v3

  deploy:
    # Deploy from the repository's default branch. Hardcoding master/main
    # excluded relaton-data-* repos that have moved their default branch
    # (e.g. v2), causing fresh data to be built but never published.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    needs: build_index_page

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
