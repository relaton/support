name: rake

on:
  workflow_call:
    inputs:
      tests-passed-event:
        description: Name of event sent with repository-dispatch after rake tests are passed successfully
        default: 'tests-passed'
        type: string
      release-event:
        description: Name of event sent to initiate release
        default: 'do-release'
        type: string
    secrets:
      pat_token:
        required: false

permissions:
  contents: write

jobs:
  rake:
    uses: metanorma/ci/.github/workflows/generic-rake.yml@main
    with:
      tests-passed-event: ${{ inputs.tests-passed-event }}
      release-event: ${{ inputs.release-event }}
      # A GITHUB_TOKEN cannot send repository_dispatch from a
      # pull_request run ("Resource not accessible by integration"), so
      # PR runs of every consumer without a pat_token secret failed at
      # the cascade step. Dependents hear about main, not about PRs.
      cascade: ${{ github.event_name != 'pull_request' }}
    secrets:
      pat_token: ${{ secrets.pat_token || github.token }}
