name: crawler

# Crawls of one dataset are exclusive: two runs racing the same repo push
# from different bases and the second push dies non-fast-forward (seen live
# when a manual canary raced the daily schedule). Queue instead of cancel —
# a crawl that waited is still a valid incremental run.
concurrency:
  group: crawler-${{ github.repository }}
  cancel-in-progress: false

on:
  workflow_call:
    inputs:
      args:
        description: Extra args to pass to crawler.rb script.
        required: false
        default: ''
        type: string
      override-files:
        description: Override files (with wget). Format url=path (multiline).
        required: false
        default: ''
        type: string
      fetch-command:
        description: >
          The Command that performs data fetch and 'git commit' data.
          The `args` input will be passed as arguments to `fetch-command`
          If needed files in 'data' directory can be removed in the beginning of the script
          Any files except 'data/*', index.yaml have to be committed explicitly
        required: false
        default: 'bundle exec ruby crawler.rb'
        type: string
      commit-indexes:
        description: >
          Defines whether index files should be committed to the repository or not.
        required: false
        default: true
        type: boolean
    secrets:
      args:
        description: Extra args to pass to crawler.rb script
        required: false

jobs:
  crawl:
    name: Documents fetching
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - run: |
          while read line
          do
            if [ "$line" = "" ]
            then
              continue
            fi
            url=${line%=*}
            path="${line#*=}"
            mkdir -p $(dirname "${path}")
            wget "${url}" -O "${path}"
          done <<< "${{ inputs.override-files }}"
        shell: bash

      # workaround for https://github.com/actions/runner-images/issues/37
      - run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: 3.4
          bundler-cache: ${{ !contains(inputs.override-files, 'Gemfile') }}

      - if: contains(inputs.override-files, 'Gemfile')
        run: |
          bundle config unset --local deployment
          bundle install

      - run: |
          ${{ inputs.fetch-command }} ${{ inputs.args }} ${{ secrets.args }}

      - name: Diff data
        id: diff
        run: |
          git add index*.yaml || true

          if [ $(git diff --name-only HEAD | grep -vE '\.zip$' | wc -l) -eq 0 ]
          then
            echo "Data not changed. Skip commit"
            echo "skip_commit=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Provenance and tombstones (TODO.sota stream 2). Both live in the
          # repo root, outside data/, so `relaton index` never reads them.
          # provenance.json records the revision the crawl read and when;
          # tombstones.yaml marks documents that disappeared from the source,
          # so a delisting is recorded instead of looking like a silent delete.
          # The file list comes from git, not from the crawler: every data repo
          # shares this workflow, whatever its fetch command.
          CRAWLER_COMMAND="${{ inputs.fetch-command }}" ruby <<'RUBY'
          require "date"
          require "json"
          require "time"
          require "yaml"

          now = Time.now.utc.iso8601
          File.write("provenance.json", JSON.pretty_generate(
            "repository" => ENV.fetch("GITHUB_REPOSITORY", ""),
            "workflow" => ENV.fetch("GITHUB_WORKFLOW", ""),
            "run_id" => ENV.fetch("GITHUB_RUN_ID", ""),
            "run_attempt" => ENV.fetch("GITHUB_RUN_ATTEMPT", ""),
            "source_revision" => ENV.fetch("GITHUB_SHA", ""),
            "crawler" => ENV.fetch("CRAWLER_COMMAND", ""),
            "crawled_at" => now,
          ) + "\n")

          deleted = IO.popen(
            ["git", "diff", "--name-only", "--diff-filter=D", "HEAD", "--", "data/"],
            &:read
          ).lines.map(&:strip).reject(&:empty?)

          existing = if File.exist?("tombstones.yaml")
                       YAML.safe_load_file("tombstones.yaml", permitted_classes: [Date, Time]) || []
                     else
                       []
                     end
          existing = [] unless existing.is_a?(Array)
          by_id = existing.each_with_object({}) do |entry, hash|
            hash[entry["id"]] = entry if entry.is_a?(Hash) && entry["id"]
          end

          deleted.each do |path|
            body = IO.popen(["git", "show", "HEAD:#{path}"], &:read)
            doc = begin
              YAML.safe_load(body, permitted_classes: [Date, Time])
            rescue StandardError
              nil
            end
            id = doc.is_a?(Hash) ? doc["id"] : nil
            if id.nil? && doc.is_a?(Hash)
              docids = Array(doc["docidentifier"])
              primary = docids.find { |d| d.is_a?(Hash) && d["primary"] } || docids.first
              id = primary["content"] if primary.is_a?(Hash)
            end
            id = File.basename(path, ".*") if id.nil? || id.to_s.strip.empty?
            by_id[id.to_s] = {
              "id" => id.to_s,
              "file" => path,
              "tombstoned_at" => now,
              "run_id" => ENV.fetch("GITHUB_RUN_ID", ""),
            }
          end

          # A document present again is not a tombstone. This matches on the
          # recorded path: a document that came back under a new filename
          # keeps its marker, which is the conservative direction.
          by_id.delete_if { |_, entry| File.exist?(entry["file"].to_s) }

          if by_id.any?
            File.write("tombstones.yaml", by_id.values.sort_by { |e| e["id"] }.to_yaml)
          elsif File.exist?("tombstones.yaml")
            File.delete("tombstones.yaml")
          end
          RUBY

          git add provenance.json
          [ -f tombstones.yaml ] && git add tombstones.yaml

          [ -d data ] && echo data/* | xargs git add
          git add -u data/
          
          if ${{ inputs.commit-indexes }}
          then
            shopt -s nullglob # https://stackoverflow.com/a/31054582/902217
            for yaml in index*.yaml; do
              zip_name="${yaml%.*}.zip"
              if ! git diff --staged --quiet HEAD -- "${yaml}"; then
                zip "${zip_name}" "${yaml}"
                git add "${zip_name}" "${yaml}"
              else
                git checkout HEAD -- "${zip_name}" 2>/dev/null || true
              fi
            done
          fi

          echo "skip_commit=false" >> $GITHUB_OUTPUT

      # Per-release manifests (TODO.sota stream 6): for every index zip this
      # crawl changed, write an immutable record beside it — content address,
      # size, row count, crawl time and the revision read. The commit is the
      # release, so the manifest and the artifact it describes stay together
      # in history while the branch keeps rolling.
      - name: Release manifests
        run: |
          changed=$(git diff --staged --name-only HEAD -- 'index*.zip' || true)
          [ -z "$changed" ] && exit 0

          for zip_name in $changed; do
            yaml="${zip_name%.zip}.yaml"
            [ -f "$zip_name" ] || continue
            [ -f "$yaml" ] || continue

            RELEASE_ZIP="$zip_name" RELEASE_YAML="$yaml" ruby <<'RUBY'
          require "date"
          require "digest"
          require "json"
          require "time"
          require "yaml"

          yaml = ENV.fetch("RELEASE_YAML")
          zip = ENV.fetch("RELEASE_ZIP")
          # The published index writes Symbol keys (`- :id: ...`).
          rows = YAML.safe_load_file(yaml, permitted_classes: [Date, Time, Symbol])
          File.write("#{File.basename(yaml, ".yaml")}.release.json", JSON.pretty_generate(
            "version" => 1,
            "index" => File.basename(yaml, ".yaml"),
            "sha256" => Digest::SHA256.file(zip).hexdigest,
            "bytes" => File.size(zip),
            "count" => Array(rows).size,
            "generated" => Time.now.utc.iso8601,
            "source_revision" => ENV.fetch("GITHUB_SHA", ""),
            "run_id" => ENV.fetch("GITHUB_RUN_ID", ""),
            "repository" => ENV.fetch("GITHUB_REPOSITORY", ""),
          ) + "\n")
          RUBY

            git add "${yaml%.yaml}.release.json"
          done

      - if: github.event_name != 'pull_request' && steps.diff.outputs.skip_commit != 'true'
        name: Push data
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git diff --staged --quiet || (git commit -m 'update documents' && git push)
