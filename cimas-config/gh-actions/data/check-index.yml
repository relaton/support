name: Check index

# The pre-merge half of the Pages pipeline: build the index, then throw it away.
#
# Deploy (gh-actions/data/deploy.yml) publishes; this proves the corpus still
# builds. Both call the SAME reusable workflow, so there is exactly one
# definition of "build the index" for the fleet and a PR can never be checked
# against a build that has drifted from the one that publishes.
#
# What it catches, and what nothing caught after support#62 dropped
# `pull_request` from the Deploy caller: `relaton index` parses the whole corpus,
# so a single malformed data/<flavor>-*.yaml fails the build for the entire
# flavor. Merged green, that surfaces hours later as a red *scheduled* Deploy on
# the default branch — never on the PR that caused it — while Pages quietly keeps
# serving the previous deployment, so there is nothing user-visible to notice
# either. On a repo whose Deploy is already red for another reason it is
# invisible.
#
# It costs no Pages work and cannot publish. data-deploy.yml gates
# actions/configure-pages, actions/upload-pages-artifact and the whole `deploy`
# job on the run being able to publish — `github.ref` equal to the repo's default
# branch — and a pull_request run's ref is `refs/pull/N/merge`, so it never is.
# That gate is central, which is why this caller needs no input and no `with:`
# block to ask for validation-only behaviour.
#
# `workflow_dispatch` is deliberately absent, and this is the one edit to resist:
# dispatching THIS workflow from the default branch WOULD satisfy that same gate
# and publish for real, from a workflow named "Check index". Dispatch Deploy for
# that; to check a branch, open its PR. Pinned by
# spec/data_deploy_caller_template_spec.rb.
#
# No `paths:` filter either, so a PR touching only prose still pays for a full
# corpus parse (~3 min on the largest flavors, which includes compiling the
# frontend). That is the first knob to turn if minutes bite — `paths: [ data/** ]`
# — at the price of a check that is silently absent rather than green.
on:
  pull_request:

jobs:
  check_index:
    # No `with:`, no `if:`, no `concurrency:` — the same doctrine as deploy.yml.
    # Cimas copies this file byte-for-byte into 30 relaton-data-* repos, so
    # anything per-repo here is either wrong for the other 29 or, once a repo
    # hand-edits it, silently reverted by the next `cimas sync`. Per-repo
    # branding lives in relaton/support's `data-index/configs.yml`, which
    # data-deploy.yml reads at build time — this run resolves it too, so a broken
    # configs.yml row fails the PR rather than the publish.
    #
    # Deliberately NARROWER than deploy.yml's grant, though both call the same
    # reusable workflow. deploy.yml must grant the union of every scope
    # data-deploy.yml's jobs request, including `pages: write` + `id-token: write`
    # for its `deploy` job. Here that job cannot run at all: it is gated on
    # `github.ref` equalling the repo's default branch, and a pull_request run's
    # ref is `refs/pull/N/merge`. A job that is skipped is never dispatched, so
    # its permission request is never evaluated — the union failure surfaces at
    # the deploy step of a real build, not when the workflow graph is parsed.
    #
    # Which is why this is `contents: read` and must stay there: `pull_request` is
    # the most reachable trigger in the repo, and the two scopes withheld are
    # exactly the two that publish. Granting them here would hand every PR in
    # every data repo the ability to deploy Pages, to buy nothing.
    #
    # If a synced repo's first PR ever fails with "requesting 'pages: write', but
    # is only allowed 'pages: none'", that reading was wrong and the fix is to
    # widen this to deploy.yml's three — not to touch the `if:` gate.
    # Pinned by spec/workflow_permissions_spec.rb.
    permissions:
      contents: read
    uses: relaton/support/.github/workflows/data-deploy.yml@main
