name: Crawler

# relaton-data-eu only. This is gh-actions/data/crawler.yml plus a `full`
# checkbox on "Run workflow": relaton-data-eu's crawler.rb takes `full` (full
# crawl with prune) or `updates`, and picks the run itself with no argument.
# The other data repos' crawler.rb files do not take `full`, so the shared
# template cannot carry it. Keep everything else in step with the shared
# template: spec/data_eu_crawler_template_spec.rb fails on any other difference.
#
# On a scheduled run `inputs.full` is empty, so `args` is '' and crawler.rb
# picks the run: a full crawl on UTC day 1 or with no cellar-since.txt, else an
# update run.

# Scheduled or by hand, and nothing else. A crawl is expensive — the largest
# flavors hold tens to hundreds of thousands of documents (relaton-data-3gpp
# 88k, relaton-data-ids 166,658) — so it should start only when there is reason
# to believe upstream has changed.
#
# Dropped `pull_request`: the shared crawler.yml gates its "Push data" step on
# `github.event_name != 'pull_request'`, so a PR crawl fetched an entire corpus
# and then discarded it.
#
# Dropped `push`: a push to the default branch re-ran a crawl that the cron
# below would run anyway, and `workflow_dispatch` covers the case where one is
# wanted sooner (it also takes the extra args a cron run cannot pass).
#
# What that costs, and it is worth knowing before editing this repo's own
# crawler.rb: the PR run was the only NON-MUTATING way to exercise a change to
# it. A `workflow_dispatch` run is not gated by the step above, so it commits
# and pushes the crawled corpus to whatever branch it runs on.
on:
  schedule:
  # Off-minute: GitHub load-sheds whole-minute-0 crons by hours (relaton
  # contract.yml#173, relaton corpus.yml#566) — the crawls were firing
  # well past 14:00 UTC fleet-wide.
  - cron: '37 14 * * *'
  workflow_dispatch:
    inputs:
      full:
        description: Full crawl of the corpus, with prune (not an update run); overrides args
        type: boolean
        required: false
        default: false
      args:
        description: Extra args to pass to crawler.rb script
        required: false
        default: ''

jobs:
  crawl:
    # Required, not hardening. The shared crawler.yml's "Push data" step runs
    # `git commit` + `git push` with the credentials actions/checkout persists,
    # i.e. GITHUB_TOKEN — and a caller granting less caps what the called
    # workflow gets. With only `contents: read` the crawl still runs to
    # completion (166,658 documents on the largest flavor) and then fails on the
    # push, having thrown the whole corpus away.
    #
    # The grant cannot live in crawler.yml itself: a called workflow's
    # `permissions:` can only downgrade the caller's. Pinned by
    # spec/data_deploy_caller_template_spec.rb.
    permissions:
      contents: write
    uses: relaton/support/.github/workflows/crawler.yml@main
    with:
      args: ${{ inputs.full && 'full' || github.event.inputs.args }}