---
# Source of truth for the relaton-data-* GitHub Pages index sites.
#
# Two commands read this file:
#
#   bin/index-branding   - resolves a repo's `title` / `favicon` / `description`
#                          and prints them in $GITHUB_OUTPUT form. Run by the
#                          "Resolve branding" step of
#                          .github/workflows/data-deploy.yml, which passes them
#                          to `relaton index`. An edit to `display`, `favicon`
#                          or `description` changes a published page on its next
#                          deploy — no data-repo change involved.
#   bin/check-data-pages - checks the Pages site returns 200, and that the repo
#                          serves the index the site's own
#                          index/manifest.json names, under `baseurl`. This
#                          file does not say which one a repo publishes, and
#                          does not guess.
#
# Branding lives here, and not in each caller's `with:` block, because
# cimas.yml maps `.github/workflows/deploy.yml` as a whole-file copy for 31
# repos: a `with:` block is wiped on the next `cimas sync` and the site silently
# loses its favicon and description.
#
# Per entry:
#   repo         - relaton-data-<repo> (also the raw.githubusercontent path segment)
#   display      - human name used in the title/description; the title is always
#                  "<display> Index", so there is no per-entry `title` key
#   branch       - the repo's real default branch (drives baseurl + Cimas target)
#   pubid_flavor - `relaton index --pubid-flavor`: the flavor whose pubid
#                  Identifier parses this corpus's docids and whose INDEXFILE
#                  names the published index. Mandatory since relaton#114 — the
#                  build raises without it. It names the FLAVOR, not the repo,
#                  so four rows differ from their slug: itu-r carries `itu`, and
#                  rfcs / rfcsubseries / ids carry `ietf`.
#
# Optional per-entry overrides (fall back to defaults when absent):
#   favicon      - override defaults.favicon
#   description  - override the templated "Welcome to the <display> ..." line
#   publish_data - `--publish-data`: copy the corpus onto the Pages site, so a
#                  client fetches documents from the same origin as the machine
#                  index. Only for a repo whose data is not served from
#                  raw.githubusercontent; every repo here commits its own data/,
#                  and the copy counts against the 1 GB Pages cap, so no row sets
#                  this either.
#
# Favicon convention: prefer the SDO's own icon where there is a stable URL for
# one; leave `favicon` unset to inherit defaults.favicon (relaton.org). Adding
# one is a one-line edit here — no data-repo or workflow change.
#
# This file used to also carry `paginate`, `pubid_class` and `pubid_require` for
# a per-repo Jekyll `_config.yml` rendered by bin/gen-data-index-config.
# support#58 (relaton/relaton#83) replaced that build with `relaton index`, and
# no relaton-data-* repo ever carried a committed `_config.yml`, so those keys
# and the generator were removed. Git history holds the old `pubid_class`
# values; the live ones are in each flavor's lib/relaton/<flavor>/data_fetcher.rb
# in relaton/relaton.
#
# It also used to carry `source`, naming the index each repo published. That was
# a hand-copied echo of a fact raw.githubusercontent.com already holds, and it
# drifted in both directions: `iana` named an index its repo had not published
# yet, `ietf` named one its repo had since deleted. The name belongs to the
# flavor: `relaton index` reads `Relaton::<Flavor>::INDEXFILE` and writes the
# result into the site's index/manifest.json, which bin/check-data-pages reads
# back. So `pubid_flavor` is the only thing this file says about an index, and
# there is nothing here to keep in step with a crawl.

defaults:
  favicon: 'https://www.relaton.org/favicon.ico'
  baseurl_template: 'https://raw.githubusercontent.com/relaton/relaton-data-%<repo>s/%<branch>s/'
  description_template: 'Welcome to the %<display>s standards index site!'

repos:
  - { repo: 3gpp,         display: 3GPP,          branch: v2,    pubid_flavor: 3gpp }
  - { repo: adobe,        display: Adobe,         branch: main,  pubid_flavor: adobe }
  - { repo: bipm,         display: BIPM,          branch: v2,    pubid_flavor: bipm }
  - { repo: calconnect,   display: CalConnect,    branch: v2,    pubid_flavor: calconnect }
  - { repo: ccsds,        display: CCSDS,         branch: v2,    pubid_flavor: ccsds }
  - { repo: cie,          display: CIE,           branch: v2,    pubid_flavor: cie }
  - { repo: easc,         display: EASC,          branch: main,  pubid_flavor: easc }
  - { repo: ecma,         display: ECMA,          branch: v2,    pubid_flavor: ecma }
  - { repo: etsi,         display: ETSI,          branch: v2,    pubid_flavor: etsi }
  - { repo: gost,         display: GOST,          branch: main,  pubid_flavor: gost }
  # Branding: taken from the `with:` block of the relaton-data-iana caller, and
  # recorded here rather than there because a `cimas sync` would drop that block
  # without trace. First flavor to follow the SDO's-own-icon convention beyond
  # the three already-live repos.
  - repo: iana
    display: IANA
    branch: v2
    pubid_flavor: iana
    favicon: 'https://www.iana.org/favicon.ico'
    description: >-
      Protocol parameter registries represent the authoritative record of many of
      the codes and numbers contained in a variety of Internet protocols.
  - { repo: iala,         display: IALA,          branch: main,  pubid_flavor: iala }
  - { repo: iec,          display: IEC,           branch: v2,    pubid_flavor: iec }
  - { repo: ieee,         display: IEEE,          branch: v2,    pubid_flavor: ieee }
  - { repo: iho,          display: IHO,           branch: v2,    pubid_flavor: iho }
  - { repo: iso,          display: ISO,           branch: v2,    pubid_flavor: iso }
  - { repo: itu-r,        display: ITU-R,         branch: v2,    pubid_flavor: itu }
  # The combined ITU-R + ITU-T corpus (one flat data/ folder, split by filename
  # prefix), which supersedes relaton-data-itu-r as a dataset. Both keep a row
  # for now: the relaton gem still consumes -itu-r, so retiring that site is a
  # separate consumer migration. Spelt out rather than one-lined because the
  # description has to say "both sectors" — otherwise the two ITU sites read
  # identically.
  - repo: itu
    display: ITU
    branch: main
    pubid_flavor: itu
    favicon: 'https://www.itu.int/favicon.ico'
    description: >-
      Combined bibliographic index of ITU-R and ITU-T publications in Relaton
      format.
  # Cimas has always synced deploy.yml into relaton-data-ietf. Until that repo
  # migrated to `Relaton::Ietf::DataFetcher` it published no index, so it
  # deliberately had no row here and its site fell back to a bare "IETF Index"
  # with no favicon and no description. It crawls on main now, so the site has a
  # real index and this row gives it an identity.
  #
  # That crawl publishes the pubid-structured index-v2 and deleted index-v1: the
  # monorepo's lib/relaton/ietf/data_fetcher.rb declares INDEXFILE_V2, and the
  # migration was a straight replacement, never a dual publish. (The retired
  # relaton-ietf gem's lib/relaton_ietf/data_fetcher.rb is the one that still
  # names index-v1; relaton-data-ietf does not use it.)
  #
  # The rfcs/rfcsubseries/ids rows below stay: every released relaton reads
  # index-v1 from those three repos. Retire them the staged way the itu-r -> itu
  # comment above describes, once relaton's Ietf::Scraper reads this index.
  - repo: ietf
    display: IETF
    branch: main
    pubid_flavor: ietf
    favicon: 'https://www.ietf.org/static/img/ietf-logo.dc9646b3c716.svg'
    description: >-
      Bibliographic data for IETF RFCs, Internet-Drafts and RFC sub-series in
      Relaton format
  - { repo: jcgm,         display: JCGM,          branch: main,  pubid_flavor: jcgm }
  - { repo: jis,          display: JIS,           branch: v2,    pubid_flavor: jis }
  - { repo: nist,         display: NIST,          branch: v2,    pubid_flavor: nist }
  - { repo: ogc,          display: OGC,           branch: v2,    pubid_flavor: ogc }
  - { repo: oiml,         display: OIML,          branch: main,  pubid_flavor: oiml }
  - { repo: plateau,      display: PLATEAU,       branch: v2,    pubid_flavor: plateau }
  - { repo: rfcs,         display: RFC,           branch: v2,    pubid_flavor: ietf }
  - { repo: rfcsubseries, display: RFC Subseries, branch: v2,    pubid_flavor: ietf }
  - { repo: xsf,          display: XSF,           branch: v2,    pubid_flavor: xsf }

  # Already-live repos (their sites returned 200 before this file existed).
  # Folded in so this file covers all 31; they carry per-repo favicon/
  # description overrides. branch: v2 is
  # each repo's real default (index-v1.yaml is served from v2).
  - repo: ids
    display: Internet-Drafts
    branch: v2
    pubid_flavor: ietf
    favicon: 'https://www.ietf.org/static/img/ietf-logo.dc9646b3c716.svg'
    description: 'Bibliographic data information for Internet-Drafts in Relaton format'
  - repo: oasis
    display: OASIS
    branch: v2
    pubid_flavor: oasis
    favicon: 'https://www.oasis-open.org/wp-content/uploads/2020/11/cropped-2-layers@3x-32x32.png'
    description: >-
      Welcome to the OASIS standards index site! This is where you can find the
      information you need about the various standards developed and maintained by
      the OASIS open community. Explore the OASIS standards and learn how they can
      help you solve your business and technical challenges!
  - repo: w3c
    display: W3C
    branch: v2
    pubid_flavor: w3c
    favicon: 'https://www.w3.org/assets/logos/w3c/w3c-no-bars.svg'
    description: >-
      Welcome to the World Wide Web Consortium standards index site! This is where
      you can find the information you need about the various standards developed and
      maintained by the W3C open community.
